<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
   

    <figure>
        <img src="background-form.avif" alt="background form image">
    </figure>
    
    <div id="right">
        <div id="header">
            <p>This is not a real online service! You know you need somethins like this in your life to help you realize your deepest dreams. Sign up now to get started. <br> You know you want to.</p>
        </div>

        <form action="" id="form">
            <h2>Let's do this!</h2>
            <div id="inputs">
            <div>
                <div>
                    <label for="first">FIRST NAME</label>
                    <input type="text" name="first" id="">
                </div>

                <div>
                    <label for="email">EMAIL</label>
                    <input type="email" name="email">
                </div>

                <div>
                    <label for="password">PASSWORD</label>
                    <input type="password" name="password">
                </div>
            </div>

            <div>
                <div>
                    <label for="last">LAST NAME</label>
                    <input type="text" name="last" id="">
                </div>

                <div>
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" name="phone">
                </div>

                <div>
                    <label for="password">CONFIRM PASSWORD</label>
                    <input type="password" name="password">
                </div>
            </div>           
            </div>
            
        </form>

        <div>
            <button>Create Account</button>
            <div id="footer">
                <p>Already have an account?</p>
                <a href="#">Log in</a>
            </div>
        </div>
    </div>
    
</body>
</html>
